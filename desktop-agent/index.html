<!DOCTYPE html>
<html>
<head>
  <title>Clipboard Sync</title>

  <style>

    body {
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    #clipboard {
      white-space: pre-wrap;
      margin-top: 20px;
      color: #cbd5e1;
    }

  </style>

</head>
<body>

  <div class="card">

    <h1>Clipboard Sync</h1>

    <p>Desktop Connected</p>

    <div id="qr"></div>

  </div>

  <div class="card">

    <h3>Latest Clipboard</h3>

    <div id="clipboard">
      Waiting...
    </div>

  </div>

  <script src="renderer.js"></script>

</body>
</html>
